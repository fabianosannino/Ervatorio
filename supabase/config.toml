# ============================================================
# Configuração local do projeto Supabase (CLI).
# Quando rodamos `supabase functions deploy`, a CLI lê estes
# overrides antes de subir cada função.
# ============================================================

project_id = "ejarqinmjlgbqzurctsf"

# ------------------------------------------------------------
# Funções que NÃO devem ter JWT verificado pelo gateway.
# São endpoints públicos chamados por serviços externos que não
# enviam Authorization: Bearer (webhooks). A autenticação é feita
# internamente pela função (validação de assinatura HMAC, etc.).
# ------------------------------------------------------------
[functions.mp-webhook]
verify_jwt = false

# ------------------------------------------------------------
# Funções que EXIGEM JWT (comportamento padrão, mas deixo explícito).
# O cliente envia Authorization: Bearer <access_token> e a função
# usa getUserFromRequest() para derivar o user_id e o papel admin.
# ------------------------------------------------------------
[functions.admin-delete-user]
verify_jwt = true

[functions.admin-metrics]
verify_jwt = true

# Onda 6.3 (guest checkout): o gateway não exige mais JWT — a
# autenticação/validação é feita DENTRO da função (usuário logado
# via getUserFromRequest OU convidado com guest_email validado +
# rate limit por IP). Kill-switch: secret GUEST_CHECKOUT=false.
[functions.create-order]
verify_jwt = false

[functions.create-payment-preference]
verify_jwt = false

# Onda 6.4 (frete): cotação pública — só devolve preço de frete a
# partir de admin_products. Sem dado sensível; protegida por rate
# limit por IP. Kill-switch: secret SHIPPING_ENABLED=false.
[functions.calculate-shipping]
verify_jwt = false

[functions.user-data-rights]
verify_jwt = true

# Onda 8.2 (troca/devolução): exige usuário logado (dono do pedido). A
# função valida posse, status retornável e o prazo de 7 dias do CDC.
[functions.create-return]
verify_jwt = true

# Newsletter etapa 2: captação anônima da landing /pausa.html. Público
# por natureza — quem se inscreve não tem conta. A proteção é rate
# limit por IP + resposta indistinguível entre e-mail novo e já
# inscrito (fecha o oráculo de enumeração que o INSERT direto abria).
[functions.newsletter-subscribe]
verify_jwt = false

# O descadastro vem de um link de e-mail, aberto por gente que não tem
# conta no site — não há JWT para verificar. A função aceita só POST
# (GET é 405 de propósito: cliente de e-mail abre link para varrer) e
# exige um token UUID que só existe na linha do próprio inscrito.
[functions.newsletter-unsubscribe]
verify_jwt = false
